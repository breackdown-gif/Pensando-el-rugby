name: Actualizar resultados
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar resultados
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python3 scripts/actualizar.py
      - name: Guardar cambios
        run: |
          git config user.name "actualizador"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Actualizar datos" && git push)
